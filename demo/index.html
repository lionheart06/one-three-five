<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>one-three-five demo</title>
  <style>
    body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; background: #eef0f3; }
    main { max-width: 760px; margin: 0 auto; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
    @media (prefers-color-scheme: dark) { body { background: #0f1114; color: #e7e9ed; } }
  </style>
</head>
<body>
  <main>
    <h1>one-three-five</h1>
    <p>Drag tasks into the 1, 3 and 5 buckets, or focus a task and press 1, 3, 5 or 0. Reload the page: your plan stays.</p>
    <div class="controls">
      <button id="drop-two">Simulate a refresh without two tasks</button>
      <button id="restore">Refresh with the full list</button>
    </div>
    <div id="board"></div>
  </main>

  <script src="../dist/one-three-five.min.js"></script>
  <script>
    const todos = [
      { id: 101, title: 'Write the Q4 planning doc', url: 'https://example.com/101' },
      { id: 102, title: 'Review the auth refactor PR' },
      { id: 103, title: 'Prepare slides for Thursday' },
      { id: 104, title: 'Fix flaky checkout test' },
      { id: 105, title: 'Reply to the vendor about pricing' },
      { id: 106, title: 'Book train tickets' },
      { id: 107, title: 'Update the onboarding checklist' },
      { id: 108, title: 'Expense last week’s dinner' },
      { id: 109, title: 'Rename the staging bucket' },
      { id: 110, title: 'Read the incident postmortem' },
      { id: 111, title: 'Call the dentist' },
      { id: 112, title: 'Archive old feature flags' },
    ];

    const board = OneThreeFive.create({ listId: 'demo', mount: '#board', todos });
    board.on('warning', ({ message }) => console.warn(message));
    window.board = board;

    document.getElementById('drop-two').onclick = () => board.setTodos(todos.slice(2));
    document.getElementById('restore').onclick = () => board.setTodos(todos);
  </script>
</body>
</html>
